<!-- Installer art, rendered to BMP by render.mjs (headless Chrome). Sizes are exact pixels at 100%:
     the NSIS installer is not DPI-aware, so Windows scales the whole window and these stay in proportion.
     #side          : finish-page side panel, 164x314 (electron-builder installerSidebar)
     #support/#topup: finish-page cards, 292x40 (= 195 dialog units, the width MUI gives finish-page text), drawn on the page's white background -->
<style>
:root{--red:#E5484D;--ink:#141518;--cream:#ECE4CF}
*{box-sizing:border-box;margin:0}
html,body{background:#fff;overflow:hidden;font-family:"Segoe UI Variable Text","Segoe UI",sans-serif}
.v{display:none}
#side{width:164px;height:314px;background:radial-gradient(170px 200px at 50% 44%,#3b3527 0%,transparent 75%),var(--ink);color:#ECEDEF;
 flex-direction:column;align-items:center;justify-content:center;gap:12px}
#side img{width:68px;height:68px}
#side b{font-size:18px;font-weight:700;letter-spacing:-.3px}
#side span{font-size:11.5px;color:#B8BDC6;text-align:center;max-width:132px;line-height:1.35}
.btn{width:292px;height:40px;border-radius:6px;align-items:center;gap:10px;padding:0 12px;font-size:12px;font-weight:600;color:#fff;line-height:1.2}
.btn small{display:block;font-weight:400;font-size:10.5px;opacity:.8}
.btn .go{margin-left:auto;font-size:11px}
.ic{font-family:"Segoe Fluent Icons","Segoe MDL2 Assets";font-size:16px}
.support{background:var(--red)}
.topup{background:#16171b}
</style>
<div id="side" class="v"><img src="../icon.png" alt=""><b>Waku</b><span>Discord co-op webcams, ready for OBS.</span></div>
<div id="support-en" class="v btn support"><span class="ic">&#xEB51;</span><div>Support the developer<small>kurohiko.id</small></div><span class="go">Open →</span></div>
<div id="topup-en" class="v btn topup"><span class="ic">&#xE7FC;</span><div>Top up your games<small>KurohikoTopUp.com</small></div><span class="go">Open →</span></div>
<div id="support-id" class="v btn support"><span class="ic">&#xEB51;</span><div>Dukung developer<small>kurohiko.id</small></div><span class="go">Buka →</span></div>
<div id="topup-id" class="v btn topup"><span class="ic">&#xE7FC;</span><div>Top up game kamu<small>KurohikoTopUp.com</small></div><span class="go">Buka →</span></div>
<script>document.getElementById(location.hash.slice(1)).style.display='flex'</script>
