<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Waku Preview</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/shared/tile.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #v { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
  #root { position: absolute; inset: 0; }
  #root.nocam .ktile:not(.virtual) { visibility: hidden; }
</style>
</head>
<body>
<video id="v" muted playsinline></video>
<div id="root" class="nocam"></div>
<script type="module" src="/preview.js"></script>
</body>
</html>
